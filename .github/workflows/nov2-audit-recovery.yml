name: Recover November 2 archive audit
on:
  push:
    branches: [nov2-audit-recovery-20261111]
    paths: ['docs/nov2-additions.json', 'scripts/recover_nov2_audit.py', 'scripts/validate_nov2_audit.py']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nov2-audit-recovery-20261111
          fetch-depth: 0
      - name: Check recovery inputs
        run: |
          test -f scripts/recover_nov2_audit.py
      - name: Recover source edits and listing counts
        run: python3 scripts/recover_nov2_audit.py
      - name: Test and rebuild
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/build_archive.py
          python3 scripts/validate_nov2_audit.py
      - name: Preserve verified build on recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/nov2-audit-recovery.yml scripts/recover_nov2_audit.py scripts/validate_nov2_audit.py
          git add -A
          git commit -m "Build and validate November 2 audit and archive listing statistics"
          git push origin HEAD:nov2-audit-recovery-20261111
